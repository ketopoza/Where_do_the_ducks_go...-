<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where do the ducks go...</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🦆</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
    <style>
        svg[aria-hidden] { position: absolute; width: 0; height: 0; overflow: hidden; }
    </style>
</head>
<body>
    <svg aria-hidden="true">
        <filter id="noise-filter" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3"/>
        </filter>
    </svg>
    <div id="app">
        <div id="map-container"></div>
        <div id="coord-readout" class="visible"></div>

        <div id="sidebar">
            <div id="minimap">
                <canvas id="minimap-canvas"></canvas>
                <div id="minimap-viewport"></div>
            </div>

            <div id="sidebar-controls">
                <div class="sidebar-control-group">
                    <button id="zoom-out" title="Zoom out (-)">−</button>
                    <span id="zoom-level">100%</span>
                    <button id="zoom-in" title="Zoom in (+)">+</button>
                </div>
                <div class="sidebar-control-group">
                    <button id="fit-view" title="Overview">⛶</button>
                    <button id="toggle-layers" title="Layers">Layers</button>
                </div>
            </div>

            <div id="virtual-tour">
                <h3>Video Tour</h3>
                <button id="tour-play" title="Play video tour">▶</button>
                <div id="tour-timeline">
                    <div id="tour-time-display">
                        <span id="tour-time-label">0.0s</span>
                        <span id="tour-stop-label"></span>
                    </div>
                    <div id="tour-track-wrap">
                        <div id="tour-track"></div>
                        <input type="range" id="tour-seek" min="0" max="1000" value="0" step="1" aria-label="Tour timeline">
                    </div>
                    <div id="tour-total-label"></div>
                </div>
            </div>

            <div id="sidebar-bottom">
                <span class="btn-label">Documentation</span>
                <a id="about-btn" href="about.html" title="Documentation">
                    <span class="btn-emoji">📚</span>
                </a>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span>Loading map...</span>
        </div>
    </div>

    <script src="js/mapViewer.js?v=6"></script>
    <script src="js/minimap.js?v=3"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
